<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work — Hawk Bryant</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet" />
</head>
<body class="page-gallery">

  <header class="site-header">
    <a href="index.html" class="wordmark">Hawk Bryant</a>
    <nav class="site-nav">
      <a href="gallery.html" class="active">Work</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="gallery-main">
    <div class="gallery-grid" id="gallery-grid"></div>
    <noscript>This gallery requires JavaScript to display photographs.</noscript>
  </main>

  <div
    class="lightbox"
    id="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Image viewer"
    aria-hidden="true"
  >
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close image viewer">✕</button>
    <button class="lightbox-prev" id="lightbox-prev" type="button" aria-label="Previous photograph">‹</button>
    <button class="lightbox-next" id="lightbox-next" type="button" aria-label="Next photograph">›</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="" />
  </div>

  <script src="gallery.js" defer></script>

  <footer class="site-footer">
    <span>© <script>document.write(new Date().getFullYear())</script> Hawk Bryant</span>
    <a href="https://www.instagram.com/hawkandthorn" target="_blank" rel="noopener">Instagram</a>
  </footer>

</body>
</html>
